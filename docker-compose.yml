services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gameeshop_mssql_db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "GameEShop2024!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_volume:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'GameEShop2024!' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user_database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: user_mssql_db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "UserGameEShop2024!"
      MSSQL_PID: "Express"
    ports:
      - "1434:1433"
    volumes:
      - user_mssql_volume:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'UserGameEShop2024!' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gameeshop:
    build:
      context: .
      dockerfile: GameEShop/Dockerfile
    container_name: gameeshop_service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=database;Database=GameEShop;User Id=sa;Password=GameEShop2024!;TrustServerCertificate=True;"
    depends_on:
      - database
    ports:
      - "5000:8080"
    
  user:
    build:
      context: .
      dockerfile: UserService/Dockerfile
    container_name: user_service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=user_database;Database=UserGameEShop;User Id=sa;Password=UserGameEShop2024!;TrustServerCertificate=True;"
    depends_on:
      - user_database
    ports:
      - "5001:8080"
    
  cart:
    build:
      context: .
      dockerfile: CartService/Dockerfile
    container_name: cart_service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=database;Database=GameEShop;User Id=sa;Password=GameEShop;TrustServerCertificate=True;"
    depends_on:
      - database
      - redis
    ports:
      - "5002:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - gameeshop
      - user
      - cart
    environment:
      - VITE_API_URL=http://gameeshop:8080
      - VITE_USER_API_URL=http://user:8080
      - VITE_CART_API_URL=http://cart:8080
  
  notificationservice:
    image: ${DOCKER_REGISTRY-}notificationservice
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    container_name: notification_service
    depends_on:
      - kafka
    environment:
      - smtpHost=${smtpHost}
      - smtpPort=${smtpPort}
      - smtpPassword=${smtpPassword}
      - smtpUsername=${smtpUsername}

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

volumes:
  mssql_volume:
  user_mssql_volume: