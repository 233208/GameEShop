

services:
  database:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: GameEShop
      MYSQL_DATABASE: GameEShop
    ports:
      - "3306:3306"
    volumes:
      - mysql_volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-uroot", "-pGameEShop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gameeshop:
    build:
      context: .
      dockerfile: GameEShop/Dockerfile
    container_name: gameeshop_service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=database;Database=GameEShop;User=root;Password=GameEShop;"
    depends_on:
      - database
    ports:
      - "5000:80"
    
  user:
    build:
      context: .
      dockerfile: UserService/Dockerfile
    container_name: user_service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=database;Database=GameEShop;User=root;Password=GameEShop;"
    depends_on:
      - database
    ports:
      - "5001:8080"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  mysql_volume:
